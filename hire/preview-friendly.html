<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>首屏風格預覽：日系 SaaS 親切</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{--cream:#fff6ee;--peach:#ffe2cf;--peach2:#ffd0b2;--ink:#1f2228;--sub:#4c515b;--muted:#6b707a;--line:#efe6dc;
  --brand:#c84b14;--brand-hover:#b04110;--bright:#f06a2a;--teal:#2a8f95;--teal-soft:#dff2f2;
  --ff:"Noto Sans TC",-apple-system,"PingFang TC",sans-serif;--fn:"Nunito","Noto Sans TC",sans-serif;--ease:cubic-bezier(.22,1,.36,1);--pad:clamp(20px,4vw,40px)}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:400 16px/1.8 var(--ff);letter-spacing:.03em;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1160px;margin:0 auto;padding:0 var(--pad)}
nav.top{background:#fff}
nav.top .wrap{display:flex;align-items:center;justify-content:space-between;height:72px;gap:20px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;text-decoration:none}
.logo i{width:32px;height:32px;border-radius:10px;background:var(--bright);display:grid;place-items:center;color:#fff;font:800 1rem var(--fn);font-style:normal}
.logo small{display:block;font-weight:400;font-size:.7rem;color:var(--muted);line-height:1.2}
.logo span{line-height:1.25;font-size:.95rem}
.links{display:flex;gap:6px}
.links a{padding:8px 14px;border-radius:999px;font-size:.88rem;font-weight:500;color:var(--sub);text-decoration:none;transition:background-color .2s,color .2s}
.links a:hover{background:var(--cream);color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 30px;border-radius:999px;font:700 1rem/1 var(--ff);letter-spacing:.06em;text-decoration:none;border:2px solid transparent;transition:background-color .2s,transform .15s var(--ease),box-shadow .2s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s var(--ease)}
.btn:hover svg{transform:translateX(3px)}
.btn.main{background:var(--brand);color:#fff;box-shadow:0 6px 0 #9a3a0e}
.btn.main:hover{background:var(--brand-hover);box-shadow:0 8px 0 #9a3a0e}
.btn.main:active{box-shadow:0 3px 0 #9a3a0e}
.btn.line{background:#fff;color:#047a35;border-color:#06c755}
.btn.line:hover{background:#effbf3}
.btn.sm{min-height:44px;padding:0 20px;font-size:.88rem;box-shadow:none}
.btn.sm:hover{box-shadow:none}

.hero{background:var(--cream);border-radius:0 0 48px 48px;padding:clamp(40px,6vw,72px) 0 clamp(88px,9vw,112px);overflow:hidden}
.hg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,5vw,64px);align-items:center}
h1{margin:0;font-size:clamp(2.1rem,4.4vw,3.3rem);line-height:1.42;font-weight:700;letter-spacing:.05em}
h1 em{font-style:normal;color:var(--brand);position:relative;white-space:nowrap}
h1 em::after{content:"";position:absolute;left:0;right:.5em;bottom:.08em;height:.28em;background:var(--peach2);z-index:-1;border-radius:4px}
h1 em{z-index:0}
.lead{margin:24px 0 32px;font-size:1.05rem;line-height:2;color:var(--sub)}
.lead b{color:var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:14px}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px;margin:28px 0 0;padding:0;list-style:none;font-size:.88rem;color:var(--sub)}
.checks li{display:flex;align-items:center;gap:8px}
.checks svg{width:20px;height:20px;flex:none}
.art{position:relative}
.art svg{width:100%;height:auto;display:block}
.stats{margin-top:-64px;position:relative}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.st{background:#fff;border-radius:24px;padding:24px 26px;box-shadow:0 18px 40px -26px rgba(120,60,20,.35);display:flex;align-items:center;gap:16px}
.st .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none}
.st .ic svg{width:26px;height:26px;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.st strong{display:block;font:800 1.9rem/1.1 var(--fn);letter-spacing:0}
.st strong small{font:700 .9rem var(--ff);margin-left:3px}
.st span{font-size:.84rem;color:var(--sub)}
.ic.o{background:var(--peach)}.ic.o svg{stroke:var(--brand)}
.ic.t{background:var(--teal-soft)}.ic.t svg{stroke:var(--teal)}
.ic.y{background:#fff1c7}.ic.y svg{stroke:#a87500}
@media (prefers-reduced-motion:no-preference){
  .copy > *{animation:up .8s var(--ease) both}.copy > :nth-child(2){animation-delay:.07s}.copy > :nth-child(3){animation-delay:.14s}.copy > :nth-child(4){animation-delay:.2s}
  .art{animation:up .9s var(--ease) .15s both}
  .stamp{animation:pop .5s cubic-bezier(.34,1.56,.64,1) .9s both;transform-box:fill-box;transform-origin:center}
  @keyframes up{from{opacity:0;transform:translateY(14px)}}
  @keyframes pop{from{opacity:0;transform:scale(.4)}}
}
@media (max-width:900px){
  .links{display:none}
  .hg{grid-template-columns:1fr}
  .art{max-width:460px;margin:8px auto 0;width:100%}
  .acts{flex-direction:column}
  .acts .btn{width:100%}
  .sg{grid-template-columns:1fr}
  .st{padding:18px 20px}
  .hero{border-radius:0 0 32px 32px}
}
</style>
</head>

    </div>
  </div>
</header>

  <div class="st"><span class="ic o"><svg viewBox="0 0 24 24"><path d="M4 20V9l8-5 8 5v11M9 20v-6h6v6"/></svg></span><div><strong>30<small>年</small></strong><span>日玖國際在地人力資源公司</span></div></div>
